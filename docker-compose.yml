services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
    ports:
      - "${PORT:-3001}:3000"
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
